name: pages

# Builds the documentation site (docs/ + mkdocs.yml) and publishes it to
# GitHub Pages. The site is the project home: guides, configuration
# reference, troubleshooting. Nothing here touches the application image.
#
# Also callable (workflow_call) by release.yml, so that a release republishes
# the site with the changelog section it just wrote. Pushes made with the
# default GITHUB_TOKEN never trigger workflows, so a plain `push` trigger is
# not enough there.

on:
  push:
    branches: [ 'dev' ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [ 'dev' ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'CHANGELOG.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build and publish (defaults to the calling ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site with warnings as errors
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy site
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.event_name == 'workflow_call')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
